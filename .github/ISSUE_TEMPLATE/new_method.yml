name: Submit a New Method
description: Submit a new ambient RNA method for inclusion in the Ambilogue
title: "[New Method]: "
labels: ["new method submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a method to the Ambilogue! Please fill in as much detail as possible.
        Fields marked as required must be completed. Optional fields can be left blank.
        
        If you have any other questions or suggestions for the Ambilogue, please submit these as a general GitHub issue.

  - type: input
    id: method
    attributes:
      label: Method Name
      placeholder: e.g. SoupX
    validations:
      required: true

  - type: dropdown
    id: publication_status
    attributes:
      label: Publication Status
      options:
        - Published
        - Preprint
        - Unpublished
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Author(s) and Publication Year
      description: "Format: Surname et al. (Year) or Surname and Surname (Year). Can write lab name if method is unpublished."
      placeholder: e.g. Young and Behjati (2020)
    validations:
      required: true

  - type: input
    id: doi
    attributes:
      label: Publication DOI
      description: This should be the DOI of the primary publication. Write N/A if the method is unpublished.
      placeholder: e.g. https://doi.org/10.1093/gigascience/giaa151
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Publication Date
      description: "Format: DD/M/YYYY. Can also provide date when software became available online if unpublished."
      placeholder: e.g. 26/12/2020
    validations:
      required: true

  - type: input
    id: notes_doi
    attributes:
      label: Publication DOI Notes
      description: If there is a secondary DOI (e.g. a newer version or corrigendum), add it here.

  - type: input
    id: github
    attributes:
      label: GitHub Link
      description: GitHub repository URL if available
      placeholder: e.g. https://github.com/constantAmateur/SoupX

  - type: input
    id: bioconductor
    attributes:
      label: Bioconductor Link
      description: Full DOI-style Bioconductor link if available
      placeholder: e.g. https://doi.org/doi:10.18129/B9.bioc.DropletUtils

  - type: checkboxes
    id: ecosystem
    attributes:
      label: Software Ecosystem
      description: Select all that apply
      options:
        - label: R
        - label: Python
        - label: Command Line
        - label: Cell Ranger
        - label: Other
    validations:
      required: true

  - type: input
    id: ecosystem_other
    attributes:
      label: "Other: Software Ecosystem"
      description: "If you selected \"Other\" above, please specify:"
      placeholder: e.g. Julia

  - type: checkboxes
    id: availability
    attributes:
      label: Software Availability
      description: Select all that apply
      options:
        - label: Bioconductor
        - label: CRAN
        - label: pip
        - label: conda
        - label: GitHub
        - label: Docker
        - label: Singularity
        - label: Cell Ranger
        - label: Other
    validations:
      required: true

  - type: input
    id: availability_other
    attributes:
      label: "Other: Software Availability"
      description: "If you selected \"Other\" above, please specify:"
      placeholder: e.g. Nextflow

  - type: dropdown
    id: requires_empties
    attributes:
      label: Requires Empty Droplets?
      description: Does the method require empty droplets to be present in the input data?
      options:
        - Required
        - Optional
        - Not required
    validations:
      required: true

  - type: textarea
    id: additional_requirements
    attributes:
      label: Additional Requirements
      description: Any additional data or software requirements (e.g. BAM file, pre-clustering). Leave blank if none.
      placeholder: e.g. BAM file; Pre-clustering (required)

  - type: checkboxes
    id: technology
    attributes:
      label: Technology Suitability
      description: Select all that apply
      options:
        - label: Droplet-based scRNA-seq
        - label: Droplet-based snRNA-seq
        - label: Droplet-based scATAC-seq
        - label: Droplet-based CITE-seq
        - label: Droplet-based scCRISPR-seq
        - label: Droplet-based scRNA+ATAC multiome
        - label: Droplet-based single-cell omics
        - label: Well-based scRNA-seq
        - label: Spatial transcriptomics
        - label: Other
    validations:
      required: true

  - type: input
    id: technology_other
    attributes:
      label: "Other: Technology Suitability"
      description: If you selected "Other" above, please specify
      placeholder: e.g. Slide-seq

  - type: textarea
    id: ambient_basis
    attributes:
      label: Ambient Basis
      description: What does the method use as a basis for estimating ambient RNA?
      placeholder: e.g. Low total UMI count droplets
    validations:
      required: true

  - type: checkboxes
    id: category
    attributes:
      label: Method Category
      description: "Select all that apply. Please see our publication for definitions of these categories: (coming soon)"
      options:
        - label: Empty droplet-like
        - label: Expression profiling-like
        - label: Demultiplexing-like
        - label: Other
    validations:
      required: true

  - type: input
    id: category_other
    attributes:
      label: "Other: Method Category"
      description: "If you selected \"Other\" above, please specify:"
      placeholder: e.g. Simulation-based

  - type: textarea
    id: approach
    attributes:
      label: Approach Description
      description: Brief description of how the method works
      placeholder: e.g. Maximum likelihood used to estimate contamination then subtract this from counts
    validations:
      required: true

  - type: textarea
    id: benchmarking
    attributes:
      label: Benchmarking Summary
      description: Summary of benchmarking results or performance notes. Use "Not yet benchmarked" if none available.
      placeholder: e.g. Recommended if compute constraints present
    validations:
      required: true

  - type: dropdown
    id: filter_empties
    attributes:
      label: Can filter empty droplets?
      description: Can the method classify empty and cell-containing droplets?
      default: 1
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: estimate_droplets
    attributes:
      label: Can estimate ambient contamination in droplets?
      description: Can the method estimate ambient contamination level per droplet or globally in the dataset?
      default: 0
      options:
        - "No"
        - Per-Droplet
        - Global
        - "Per-Droplet; Global"
    validations:
      required: true

  - type: dropdown
    id: estimate_genes
    attributes:
      label: Can identify genes driving ambient contamination?
      description: Can the method identify which genes contribute most to ambient RNA contamination?
      default: 1
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: correct
    attributes:
      label: Can correct ambient contamination?
      description: Can the method correct ambient RNA contamination in the count matrix?
      default: 1
      options:
        - "Yes"
        - "No"
        - Selected genes only
    validations:
      required: true

  - type: dropdown
    id: qc_plot
    attributes:
      label: Can generate ambient contamination QC plots?
      description: Does the method produce QC plots related to ambient RNA contamination?
      default: 1
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: simulate
    attributes:
      label: Can simulate datasets with ambient contamination?
      description: Can the method simulate datasets that contain ambient RNA contamination?
      default: 1
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: other_features
    attributes:
      label: Other Features
      description: Any other notable features (e.g. doublet detection, genetic demultiplexing). Leave blank if none.
      placeholder: e.g. Genetic demultiplexing; Doublet detection

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any additional notes or caveats about the method. Leave blank if none.
