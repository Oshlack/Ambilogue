name: Update Ambilogue Method Plots

# Redraws the plots made by analysis/plot_ambilogue.R:
#   - on every push to main,
#   - once a month (1st of the month, after the citation plots are drawn), and
#   - on demand from the Actions tab.
# Pushes made by other workflows with the default GITHUB_TOKEN (the daily citation
# job, and this job's own commit below) do not trigger workflows, so this cannot loop.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 1 * *'   # 1st of each month at 08:00 UTC, after the citation plots (07:30)
  workflow_dispatch:        # Allow manual trigger from the GitHub Actions tab

concurrency:
  group: ambilogue-method-plots
  cancel-in-progress: false

jobs:
  update-plots:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Needed to commit and push the updated figures

    env:
      RENV_PATHS_ROOT: ~/.cache/R/renv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-${{ hashFiles('analysis/renv.lock') }}
          restore-keys: ${{ runner.os }}-renv-

      # Starting R inside analysis/ runs .Rprofile, which activates the renv project.
      - name: Restore R packages from renv.lock
        working-directory: analysis
        shell: Rscript {0}
        run: renv::restore()

      - name: Draw method figures
        working-directory: analysis
        run: Rscript plot_ambilogue.R

      - name: Commit and push if figures changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/plots
          if git diff --staged --quiet; then
            echo "Method figures unchanged — nothing to commit."
          else
            git commit -m "chore: update Ambilogue method plots $(date -u '+%Y-%m-%d')"
            git pull --rebase
            git push
          fi
